<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Schéma de l'écran d'accueil de l'application Downloader</title>
  <rect width="880" height="470" rx="18" fill="#fffaf4"/>
  <rect x="20" y="20" width="840" height="330" rx="12" fill="#1e1e1e"/>
  <!-- menu de gauche -->
  <rect x="20" y="20" width="170" height="330" rx="12" fill="#2a2a2a"/>
  <g font-size="16" fill="#ddd">
    <rect x="34" y="52" width="142" height="36" rx="6" fill="#e8770e"/>
    <text x="50" y="76" fill="#fff" font-weight="600">Home</text>
    <text x="50" y="122">Browser</text>
    <text x="50" y="162">Files</text>
    <text x="50" y="202">Favorites</text>
    <text x="50" y="242">Settings</text>
    <text x="50" y="282">Help</text>
  </g>
  <!-- zone principale -->
  <text x="220" y="80" fill="#fff" font-size="22" font-weight="600">Downloader</text>
  <text x="220" y="128" fill="#aaa" font-size="15">Enter a URL or Search Term</text>
  <rect x="220" y="140" width="612" height="48" rx="6" fill="#fff" stroke="#f5b301" stroke-width="3"/>
  <text x="232" y="170" fill="#111" font-size="13.5">github.com/thomasjanet60-spec/CroissantTV-beta/releases/latest/download/CroissantTV.apk</text>
  <rect x="220" y="208" width="120" height="44" rx="6" fill="#e8770e" stroke="#f5b301" stroke-width="3"/>
  <text x="280" y="237" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">Go</text>
  <!-- pastilles -->
  <g font-size="16" font-weight="700" text-anchor="middle" fill="#21130c">
    <circle cx="832" cy="140" r="14" fill="#f5b301"/><text x="832" y="146">1</text>
    <circle cx="352" cy="230" r="14" fill="#f5b301"/><text x="352" y="236">2</text>
  </g>
  <!-- légende -->
  <g font-size="16" fill="#21130c">
    <text x="40" y="390"><tspan font-weight="700">1</tspan>  Sélectionne le champ et tape l'adresse, sans espace (le https:// n'est pas nécessaire)</text>
    <text x="40" y="420"><tspan font-weight="700">2</tspan>  Go : le téléchargement démarre, puis la TV propose d'installer CroissantTV</text>
    <text x="40" y="452" fill="#6b5a50" font-size="13">Schéma simplifié : l'apparence de Downloader change selon sa version.</text>
  </g>
</svg>
