<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Schéma de la fenêtre Mode développeur d'une TV Samsung</title>
  <rect width="880" height="520" rx="18" fill="#fffaf4"/>
  <!-- écran TV avec l'écran des applications en fond -->
  <rect x="20" y="20" width="840" height="360" rx="12" fill="#1b1f2a"/>
  <g fill="#2b3142">
    <rect x="50" y="300" width="110" height="60" rx="8"/><rect x="175" y="300" width="110" height="60" rx="8"/>
    <rect x="300" y="300" width="110" height="60" rx="8"/><rect x="425" y="300" width="110" height="60" rx="8"/>
    <rect x="550" y="300" width="110" height="60" rx="8"/><rect x="675" y="300" width="110" height="60" rx="8"/>
  </g>
  <text x="50" y="60" fill="#c9cfdd" font-size="20">Applications</text>

  <!-- fenêtre -->
  <rect x="190" y="70" width="500" height="250" rx="14" fill="#f2f4f8"/>
  <text x="440" y="112" fill="#111" font-size="22" font-weight="700" text-anchor="middle">Mode développeur</text>
  <text x="220" y="158" fill="#333" font-size="16">Mode développeur</text>
  <rect x="470" y="138" width="88" height="32" rx="16" fill="#1d6ef2"/>
  <text x="514" y="160" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">Activé</text>
  <rect x="566" y="138" width="98" height="32" rx="16" fill="#dde2ea"/>
  <text x="615" y="160" fill="#555" font-size="15" text-anchor="middle">Désactivé</text>
  <text x="220" y="210" fill="#333" font-size="16">Adresse IP du PC hôte</text>
  <rect x="220" y="222" width="300" height="38" rx="6" fill="#fff" stroke="#9aa3b2"/>
  <text x="236" y="248" fill="#111" font-size="18" font-weight="600">192 . 168 . 1 . 25</text>
  <rect x="470" y="276" width="88" height="32" rx="8" fill="#1d6ef2"/>
  <text x="514" y="298" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">OK</text>
  <rect x="566" y="276" width="98" height="32" rx="8" fill="#dde2ea"/>
  <text x="615" y="298" fill="#333" font-size="15" text-anchor="middle">Annuler</text>

  <!-- pastilles -->
  <g font-size="16" font-weight="700" text-anchor="middle" fill="#21130c">
    <circle cx="690" cy="154" r="14" fill="#f5b301"/><text x="690" y="160">1</text>
    <circle cx="545" cy="241" r="14" fill="#f5b301"/><text x="545" y="247">2</text>
    <circle cx="452" cy="292" r="14" fill="#f5b301"/><text x="452" y="298">3</text>
  </g>

  <!-- légende -->
  <g font-size="16" fill="#21130c">
    <text x="40" y="416">Sur l'écran <tspan font-weight="700">Applications</tspan>, tape <tspan font-weight="700">1 2 3 4 5</tspan> à la télécommande : cette fenêtre s'ouvre.</text>
    <text x="40" y="446"><tspan font-weight="700">1</tspan>  Mode développeur : Activé (On)</text>
    <text x="40" y="474"><tspan font-weight="700">2</tspan>  L'adresse IP de ton ordinateur, affichée par Apps2Samsung (Host PC IP)</text>
    <text x="40" y="502"><tspan font-weight="700">3</tspan>  OK, puis redémarre complètement la TV</text>
    <text x="560" y="502" fill="#6b5a50" font-size="13">Schéma simplifié : libellés selon les modèles.</text>
  </g>
</svg>
