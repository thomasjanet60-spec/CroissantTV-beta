  <rect x="207" y="152" width="86" height="62" rx="10" fill="none" stroke="#f5b301" stroke-width="6"/>
  <path d="M232 152l-12-14M268 152l12-14" stroke="#f5b301" stroke-width="5" stroke-linecap="round"/>
  <path d="M226 178q24 26 48 0" fill="none" stroke="#f5b301" stroke-width="9" stroke-linecap="round"/>
