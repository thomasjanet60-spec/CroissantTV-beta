<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Schéma de l'application Developer Mode sur une TV LG</title>
  <rect width="880" height="560" rx="18" fill="#fffaf4"/>
  <!-- écran TV -->
  <rect x="20" y="20" width="840" height="400" rx="12" fill="#111"/>
  <text x="48" y="78" fill="#fff" font-size="40" font-weight="300" letter-spacing="2">DEVELOPER MODE</text>
  <text x="48" y="104" fill="#ddd" font-size="14">Enable or disable Developer Mode services on this device</text>
  <line x1="40" y1="122" x2="840" y2="122" stroke="#555" stroke-width="2"/>
  <text x="48" y="156" fill="#bbb" font-size="20">Welcome to Developer Mode!</text>

  <!-- colonne gauche -->
  <g font-size="16" fill="#eee">
    <text x="58" y="206">IP Address (wireless):</text>
    <text x="250" y="206" fill="#fff" font-weight="600">192.168.1.40</text>
    <text x="58" y="246">IP Address (wired):</text>
    <text x="250" y="246" fill="#888">—</text>
    <text x="58" y="286">Passphrase:</text>
    <text x="250" y="286" fill="#fff" font-weight="600">AB12CD</text>
    <text x="58" y="326">Remain Session:</text>
    <text x="250" y="326" fill="#fff">999:58:12</text>
  </g>
  <rect x="44" y="186" width="330" height="70" rx="8" fill="none" stroke="#f5b301" stroke-width="3"/>
  <rect x="44" y="266" width="330" height="30" rx="8" fill="none" stroke="#f5b301" stroke-width="3"/>

  <!-- colonne droite -->
  <g font-size="15" fill="#eee">
    <rect x="500" y="186" width="78" height="32" rx="16" fill="#c4174a"/>
    <text x="539" y="208" fill="#fff" text-anchor="middle" font-weight="600">ON</text>
    <text x="596" y="208">Dev Mode Status</text>
    <rect x="500" y="236" width="78" height="32" rx="16" fill="#c4174a"/>
    <text x="539" y="258" fill="#fff" text-anchor="middle" font-weight="600">ON</text>
    <text x="596" y="258">Key Server</text>
    <rect x="500" y="286" width="78" height="32" rx="16" fill="#555"/>
    <text x="539" y="308" fill="#fff" text-anchor="middle" font-weight="600">EXTEND</text>
    <text x="596" y="308">Extend Session Time</text>
    <rect x="500" y="336" width="78" height="32" rx="16" fill="#555"/>
    <text x="539" y="358" fill="#fff" text-anchor="middle" font-weight="600">OFF</text>
    <text x="596" y="358">Clear Cache Data</text>
  </g>

  <!-- pastilles numérotées -->
  <g font-size="16" font-weight="700" text-anchor="middle">
    <circle cx="478" cy="202" r="14" fill="#f5b301"/><text x="478" y="208" fill="#21130c">1</text>
    <circle cx="478" cy="252" r="14" fill="#f5b301"/><text x="478" y="258" fill="#21130c">2</text>
    <circle cx="392" cy="221" r="14" fill="#f5b301"/><text x="392" y="227" fill="#21130c">3</text>
    <circle cx="392" cy="281" r="14" fill="#f5b301"/><text x="392" y="287" fill="#21130c">4</text>
    <circle cx="478" cy="302" r="14" fill="#f5b301"/><text x="478" y="308" fill="#21130c">5</text>
  </g>

  <!-- légende -->
  <g font-size="16" fill="#21130c">
    <text x="40" y="456"><tspan font-weight="700">1</tspan>  Dev Mode Status sur ON (la TV redémarre)</text>
    <text x="40" y="484"><tspan font-weight="700">2</tspan>  Key Server sur ON</text>
    <text x="40" y="512"><tspan font-weight="700">3</tspan>  Note l'adresse IP de la TV</text>
    <text x="460" y="456"><tspan font-weight="700">4</tspan>  Note la Passphrase (6 caractères)</text>
    <text x="460" y="484"><tspan font-weight="700">5</tspan>  EXTEND : à faire une fois par mois</text>
    <text x="460" y="512" fill="#6b5a50" font-size="13">Schéma simplifié : ton écran peut un peu différer.</text>
  </g>
</svg>
